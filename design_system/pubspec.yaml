name: design_system
description: "A new Flutter package project."
version: 0.0.1

publish_to: 'none'

homepage:

environment:
  sdk: ^3.5.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
    
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  path_provider: ^2.1.4
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # packages
  core:
    path: ../core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:

  assets:
    - assets/lotties/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500